<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>

    <h1>Login if you are new here</h1>

    <form action="index.html" method="POST">

        <table>

            <tr>
                <td>
                    <label for="username">
                        Username: <span style="color: blue;">*</span>
                    </label>
                </td>
                <td>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter Username"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td>
                    <label for="password">
                        Password: <span style="color: blue;">*</span>
                    </label>
                </td>
                <td>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter Password"
                        required
                    >
                </td>
            </tr>

            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" value="Login">
                </td>
            </tr>

        </table>

                        <p>
                            <h2>If you are a new user then click here</h2>
                            <a href="http://127.0.0.1:3000/html/college_01.html?serverWindowId=c6ee02a4-244f-4634-8380-3ce22edd4f28">Sign Up</a>
                        </p>

    </form>

</body>
</html>
